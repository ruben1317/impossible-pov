services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_CONFIG_PATH: /config/app.yaml
      DATABASE_URL: sqlite:////data/impossible_pov.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./config:/config:ro
      - backend_data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  backend_data:
